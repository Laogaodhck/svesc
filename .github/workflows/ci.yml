name: CI

# 质量门禁：任何分支推送与发往 main 的 PR 都必须通过类型检查、单元测试和生产构建。
# 平台固定 windows-latest：引擎会真实调用 cmd/PowerShell，且 tests/exec-real.test.ts
# 依赖 Windows 的进程树与 taskkill 行为，Linux 上会跳过这些用例而失去门禁意义。

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 类型检查 / 测试 / 构建
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # Electron 与 electron-builder 的二进制不在 npm 缓存里，单独缓存避免每次重下。
      - name: 缓存 Electron 运行时
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: 安装依赖
        run: npm ci

      - name: 主进程与脚本类型检查
        run: npm run typecheck

      - name: 渲染器类型检查
        run: npm run typecheck:web

      - name: 单元测试
        run: npm test

      - name: 生产构建
        run: npm run build
